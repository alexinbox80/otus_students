services:
    symfony_php-fpm:
        image: php:8.3-fpm-alpine
        build:
            dockerfile: docker/php-fpm/Dockerfile
        container_name: 'students_php'
        ports:
            - '9000:9000'
        volumes:
            - ./:/app
        working_dir: /app
        networks:
            - net

    symfony_caddy:
        image: dunglas/frankenphp:1-builder-php8.3
        build:
            dockerfile: docker/caddy/Dockerfile
        container_name: 'students_caddy'
        ports:
            - '6443:443'
            - '6080:80'
            - '6088:2019'
        volumes:
            - ./:/app
            - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile
        working_dir: /app
        networks:
            - net

    symfony_nginx:
        image: nginx
        container_name: 'students_nginx'
        working_dir: /app
        ports:
            - '8080:80'
        volumes:
            - ./:/app
            - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
        networks:
            - net

    symfony_postgres:
        image: postgres:15
        ports:
            - 5432:5432
        container_name: 'students_postgres'
        working_dir: /app
        restart: always
        environment:
            POSTGRES_DB: 'students'
            POSTGRES_USER: 'user'
            POSTGRES_PASSWORD: 'password'
        volumes:
            - dump:/app/dump
            - postgresql:/var/lib/postgresql/data
        networks:
            - net

    symfony_redis:
        container_name: 'students_redis'
        image: redis:alpine
        ports:
            - 6379:6379
        networks:
            - net

    symfony_rabbitmq:
        image: rabbitmq:3-management
        working_dir: /app
        hostname: symfony_rabbit-mq
        container_name: 'students_rabbit-mq'
        ports:
            - 15672:15672
            - 5672:5672
        environment:
            RABBITMQ_DEFAULT_USER: user
            RABBITMQ_DEFAULT_PASS: password
        networks:
            - net

    symfony_supervisor:
        image: php:8.3-cli-alpine
        build: docker/supervisor
        container_name: 'students_supervisor'
        volumes:
            - ./:/app
            - ./docker/supervisor/supervisord.conf:/etc/supervisor/supervisord.conf
        working_dir: /app
        command: [ "supervisord", "-c", "/etc/supervisor/supervisord.conf" ]
        networks:
            - net

#Docker Networks
networks:
    net:
        driver: bridge

#Docker Volumes
volumes:
    dump:
    postgresql:
