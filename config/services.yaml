# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    baseUrl: 'http://localhost:8080'
    uploadPrefix: '/app/public'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Controller\Web\User\UpdateUserAvatarLink\v1\Manager:
        arguments:
            $baseUrl: '%baseUrl%'
            $uploadPrefix: '%uploadPrefix%'

    App\Application\EventListener\KernelExceptionEventListener:
        tags:
            - { name: kernel.event_listener, event: kernel.exception }

    App\Application\EventListener\KernelViewEventListener:
        tags:
            - { name: kernel.event_listener, event: kernel.view }

    App\Application\Security\AuthService:
        arguments:
            $tokenTTL: '%env(JWT_TTL_SEC)%'

    redis_client:
        class: Redis
        factory: Symfony\Component\Cache\Adapter\RedisAdapter::createConnection
        arguments:
            - '%env(REDIS_DSN)%'

    redis_tag_aware_adapter:
        class: Symfony\Component\Cache\Adapter\RedisTagAwareAdapter
        arguments:
            - '@redis_client'
            - 'students_cache'

    App\Infrastructure\Repository\SkillRepositoryCacheDecorator:
        arguments:
            $cache: '@redis_tag_aware_adapter'

    App\Infrastructure\Repository\CompletedTaskRepositoryCacheDecorator:
        arguments:
            $cache: '@redis_tag_aware_adapter'

    App\Infrastructure\Repository\StudentRepositoryCacheDecorator:
        arguments:
            $cache: '@redis_tag_aware_adapter'

    App\Infrastructure\Repository\StudentGradeRepositoryCacheDecorator:
        arguments:
            $cache: '@redis_tag_aware_adapter'

    App\Infrastructure\Bus\RabbitMqBus:
        calls:
            - [ 'registerProducer', [ !php/enum App\Infrastructure\Bus\AmqpExchangeEnum::SendNotification, '@old_sound_rabbit_mq.send_notification_producer' ] ]
            - [ 'registerProducer', [ !php/enum App\Infrastructure\Bus\AmqpExchangeEnum::StudentsGrade, '@old_sound_rabbit_mq.students_grade_producer' ] ]
