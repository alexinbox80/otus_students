api_platform:
    title: API Platform on Students Service
    version: 1.0.0
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']

    mapping:
        paths:
            - '%kernel.project_dir%/src/Domain/Entity'

    swagger:
        api_keys:
            JWT:
                name: Authorization
                type: header

    http_cache:
        invalidation:
            # We assume that your API can reach your caddy instance by the hostname http://caddy.
            # The endpoint /souin-api/souin is the default path to the invalidation API.
            urls: ['http://symfony_caddy/souin-api/souin']
            purger: api_platform.http_cache.purger.souin
