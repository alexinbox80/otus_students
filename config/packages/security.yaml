security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Domain\Entity\User
                property: login
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        refreshToken:
            pattern: ^/api/v1/refresh-token
            stateless: true
            custom_authenticator: App\Application\Security\ApiTokenAuthenticator
        token:
            pattern: ^/api/v1/get-token
            security: false
#        createUser:
#            pattern: ^/api/v1/user
#            security: false
#            methods: POST
        apiPlatform:
            pattern: ^/api-platform$
            security: false
        main:
            lazy: true
            provider: app_user_provider
            stateless: true
            custom_authenticator: App\Application\Security\JwtAuthenticator
            security: true

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        - { path: ^/api/v1/achievement, roles: [ ROLE_TEACHER ] }
        - { path: ^/api/v1/completed-task, roles: [ ROLE_TEACHER ] }
        - { path: ^/api/v1/course, roles: [ ROLE_MANAGER ] }
        - { path: ^/api/v1/lesson, roles: [ ROLE_MANAGER ] }
        - { path: ^/api/v1/manager, roles: [ ROLE_MANAGER ] }
        - { path: ^/api/v1/percentage, roles: [ ROLE_MANAGER ] }
        - { path: ^/api/v1/skill, roles: [ ROLE_MANAGER ] }
        - { path: ^/api/v1/student, roles: [ ROLE_STUDENT ] }
        - { path: ^/api/v1/task, roles: [ ROLE_TEACHER ] }
        - { path: ^/api/v1/teacher, roles: [ ROLE_TEACHER ] }
        - { path: ^/api/v1/users, roles: [ ROLE_STUDENT, ROLE_TEACHER, ROLE_MANAGER ], methods: [ GET ] }
        - { path: ^/api/v1/user, roles: [ ROLE_STUDENT, ROLE_TEACHER, ROLE_MANAGER ], methods: [ POST ] }
        - { path: ^/api/v1/user, roles: [ ROLE_TEACHER, ROLE_MANAGER ], methods: [ PATCH, DELETE ] }
        - { path: ^/api/v1/update-user-avatar-link/\d+$, roles: [ ROLE_STUDENT, ROLE_TEACHER, ROLE_MANAGER ], methods: [ POST ] }
        - { path: ^/api/v1/student/email-confirmation, roles: [ ROLE_STUDENT, ROLE_MANAGER ], methods: [ POST ] }
        - { path: ^/api/v1/student/phone-confirmation, roles: [ ROLE_STUDENT, ROLE_MANAGER ], methods: [ POST ] }
        - { path: ^/api/v1/teacher/email-confirmation, roles: [ ROLE_TEACHER, ROLE_MANAGER ], methods: [ POST ] }
        - { path: ^/api/v1/teacher/phone-confirmation, roles: [ ROLE_TEACHER, ROLE_MANAGER ], methods: [ POST ] }

    role_hierarchy:
            ROLE_ADMIN: [ ROLE_STUDENT, ROLE_TEACHER, ROLE_MANAGER ]

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
