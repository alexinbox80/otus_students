old_sound_rabbit_mq:
    connections:
        default:
            url: '%env(RABBITMQ_URL)%'
    producers:
        send_notification:
            connection: default
            exchange_options: { name: 'old_sound_rabbit_mq.send_notification', type: topic }
        students_grade:
            connection: default
            exchange_options: { name: 'old_sound_rabbit_mq.students_grade', type: direct }

#        # use 'old_sound_rabbit_mq.task_producer' service to send data.
#        task:
#            connection:       default
#            exchange_options: { name: 'task', type: direct }

    consumers:
        send_notification.email:
            connection: default
            exchange_options: { name: 'old_sound_rabbit_mq.send_notification', type: topic }
            queue_options:
                name: 'old_sound_rabbit_mq.consumer.send_notification.email'
                routing_keys: [ 'email' ]
            callback: App\Controller\Amqp\SendEmailNotification\Consumer
            idle_timeout: 300
            idle_timeout_exit_code: 0
            graceful_max_execution:
                timeout: 1800
                exit_code: 0
            qos_options: { prefetch_size: 0, prefetch_count: 1, global: false }

        send_notification.sms:
            connection: default
            exchange_options: { name: 'old_sound_rabbit_mq.send_notification', type: topic }
            queue_options:
                name: 'old_sound_rabbit_mq.consumer.send_notification.sms'
                routing_keys: [ 'sms' ]
            callback: App\Controller\Amqp\SendSmsNotification\Consumer
            idle_timeout: 300
            idle_timeout_exit_code: 0
            graceful_max_execution:
                timeout: 1800
                exit_code: 0
            qos_options: { prefetch_size: 0, prefetch_count: 1, global: false }

        students_grade:
            connection: default
            exchange_options: { name: 'old_sound_rabbit_mq.students_grade', type: direct }
            queue_options: { name: 'old_sound_rabbit_mq.consumer.students_grade' }
            callback: App\Controller\Amqp\StudentsGrade\Consumer
            idle_timeout: 300
            idle_timeout_exit_code: 0
            graceful_max_execution:
                timeout: 1800
                exit_code: 0
            qos_options: { prefetch_size: 0, prefetch_count: 1, global: false }

